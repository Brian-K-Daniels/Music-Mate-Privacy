# R8 keep rules for Release Android builds.
# AppCompat inflates FitWindows* from XML via reflection — R8 otherwise removes them
# and MainActivity crashes with ClassNotFoundException / InflateException.

-keep class androidx.appcompat.widget.FitWindowsFrameLayout { *; }
-keep class androidx.appcompat.widget.FitWindowsLinearLayout { *; }
-keep class androidx.appcompat.widget.** { *; }
